<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Enterprise application integration hub">
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#333">Enterprise Application Integration (iPaaS hub pattern)</text>
  <!-- Hub -->
  <circle cx="320" cy="190" r="52" fill="#1a3a5c" stroke="#0d2137" stroke-width="2"/>
  <text x="320" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Harmony</text>
  <text x="320" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#cce0f0">iPaaS</text>
  <!-- Apps -->
  <rect x="40" y="60" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="90" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1565c0">Salesforce</text>
  <rect x="500" y="60" width="100" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="550" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2e7d32">NetSuite</text>
  <rect x="40" y="280" width="100" height="44" rx="6" fill="#fff3e0" stroke="#f57c00"/>
  <text x="90" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ef6c00">SAP / ERP</text>
  <rect x="500" y="280" width="100" height="44" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="550" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6a1b9a">Data Warehouse</text>
  <!-- Lines -->
  <line x1="140" y1="82" x2="268" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="82" x2="372" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="140" y1="302" x2="268" y2="220" stroke="#666" stroke-width="2"/>
  <line x1="500" y1="302" x2="372" y2="220" stroke="#666" stroke-width="2"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker></defs>
</svg>

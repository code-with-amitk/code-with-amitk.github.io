<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Four steps to set up a new follower: snapshot, copy, catch up from the replication log, then stream live changes">
  <rect width="960" height="280" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333">Setting up a new follower (no downtime)</text>

  <defs>
    <marker id="sarr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="55" width="200" height="175" rx="10" fill="#fff" stroke="#e65100" stroke-width="2"/>
  <circle cx="48" cy="82" r="14" fill="#e65100"/>
  <text x="48" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="120" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e65100">Snapshot</text>
  <text x="120" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Consistent copy of</text>
  <text x="120" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">leader at time T</text>
  <text x="120" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">record LSN /</text>
  <text x="120" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">binlog coordinates</text>

  <line x1="220" y1="140" x2="248" y2="140" stroke="#666" stroke-width="2" marker-end="url(#sarr)"/>

  <!-- Step 2 -->
  <rect x="250" y="55" width="200" height="175" rx="10" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
  <circle cx="278" cy="82" r="14" fill="#6a1b9a"/>
  <text x="278" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="350" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6a1b9a">Copy</text>
  <text x="350" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Ship snapshot files</text>
  <text x="350" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">to the new node</text>
  <text x="350" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">leader keeps serving</text>
  <text x="350" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">writes during copy</text>

  <line x1="450" y1="140" x2="478" y2="140" stroke="#666" stroke-width="2" marker-end="url(#sarr)"/>

  <!-- Step 3 -->
  <rect x="480" y="55" width="200" height="175" rx="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <circle cx="508" cy="82" r="14" fill="#1565c0"/>
  <text x="508" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="580" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1565c0">Catch up</text>
  <text x="580" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Request all changes</text>
  <text x="580" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">since the snapshot</text>
  <text x="580" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">replay WAL / binlog</text>
  <text x="580" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">from recorded position</text>

  <line x1="680" y1="140" x2="708" y2="140" stroke="#666" stroke-width="2" marker-end="url(#sarr)"/>

  <!-- Step 4 -->
  <rect x="710" y="55" width="230" height="175" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="738" cy="82" r="14" fill="#2e7d32"/>
  <text x="738" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="825" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32">Live stream</text>
  <text x="825" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Caught up  now apply</text>
  <text x="825" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">changes as they happen</text>
  <text x="825" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">ready for client reads</text>
  <text x="825" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">(hot standby)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="Leader-based replication: clients write to the leader, the leader ships a replication log to followers, reads can go to any replica">
  <rect width="880" height="460" fill="#fafafa"/>
  <text x="440" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333">Leader-based replication (masterslave)</text>
  <text x="440" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Writes go only to the leader. Followers apply the same changes, in the same order, from the replication log.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
    <marker id="arr-write" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arr-repl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arr-read" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Clients -->
  <rect x="40" y="90" width="130" height="52" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="105" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474f">Client A</text>
  <text x="105" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">wants to write</text>

  <rect x="40" y="280" width="130" height="52" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="105" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474f">Client B</text>
  <text x="105" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">wants to read</text>

  <!-- Leader -->
  <rect x="300" y="150" width="170" height="90" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
  <text x="385" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e65100">Leader</text>
  <text x="385" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#bf360c">primary / master</text>
  <text x="385" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6d4c41">accepts all writes</text>

  <!-- Followers -->
  <rect x="640" y="80" width="180" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1565c0">Follower 1</text>
  <text x="730" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0d47a1">read replica / hot standby</text>
  <text x="730" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">read-only for clients</text>

  <rect x="640" y="250" width="180" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="730" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1565c0">Follower 2</text>
  <text x="730" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0d47a1">read replica / hot standby</text>
  <text x="730" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">read-only for clients</text>

  <!-- Write arrow -->
  <line x1="170" y1="116" x2="298" y2="175" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-write)"/>
  <text x="210" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828">1. Write</text>

  <!-- Replication arrows -->
  <line x1="470" y1="175" x2="638" y2="120" stroke="#e65100" stroke-width="2.5" marker-end="url(#arr-repl)"/>
  <line x1="470" y1="215" x2="638" y2="280" stroke="#e65100" stroke-width="2.5" marker-end="url(#arr-repl)"/>
  <text x="500" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">2. Replication log</text>
  <text x="500" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">2. Replication log</text>

  <!-- Read arrows -->
  <line x1="170" y1="306" x2="298" y2="230" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-read)"/>
  <path d="M170 320 C 280 400, 520 400, 640 330" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-read)"/>
  <path d="M105 332 C 105 420, 730 420, 730 330" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-read)"/>
  <text x="200" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565c0">3. Read (leader or any follower)</text>

  <!-- Legend -->
  <rect x="40" y="400" width="800" height="42" rx="6" fill="#fff" stroke="#ddd"/>
  <line x1="60" y1="421" x2="110" y2="421" stroke="#c62828" stroke-width="2.5"/>
  <text x="118" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">write (leader only)</text>
  <line x1="280" y1="421" x2="330" y2="421" stroke="#e65100" stroke-width="2.5"/>
  <text x="338" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">replication log / change stream</text>
  <line x1="560" y1="421" x2="610" y2="421" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="618" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">read (any replica)</text>
</svg>
